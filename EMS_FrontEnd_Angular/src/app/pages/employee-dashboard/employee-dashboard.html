<div class="container">

  <!-- Header with Logout on top right -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2>Employee DashBoard</h2>
    <button type="button" (click)="LOGOUT()"
            style="background-color:#f44336; color:white; padding:5px 12px; border:none; border-radius:4px; cursor:pointer;">
      LOGOUT
    </button>
  </div>
  <!-- Employee Form -->
  <form (ngSubmit)="saveEmployee()" #empForm="ngForm">

    <input type="text"
           placeholder="Name"
           [(ngModel)]="employee.name"
           name="name"
           required>

    <input type="email"
           placeholder="Email"
           [(ngModel)]="employee.email"
           name="email"
           required>

    <input type="number"
           placeholder="Salary"
           [(ngModel)]="employee.salary"
           name="salary"
           required>

    <!-- Add/Update button disabled if empty or salary <=0 -->
    <button type="submit"
            [disabled]="!employee.name || !employee.email || employee.salary <= 0">
      {{ isEditMode ? 'Update' : 'Add' }}
    </button>

    <button type="button" (click)="resetForm()">
      Clear
    </button>

  </form>

  <hr>

  <!-- Employee Table -->
  <table border="1" width="100%" cellpadding="8">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Email</th>
        <th>Salary</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td>{{ emp.id }}</td>
        <td>{{ emp.name }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.salary }}</td>
        <td>
          <button type="button" (click)="editEmployee(emp)">Edit</button>
          <button type="button" (click)="deleteEmployee(emp.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="employees.length === 0">
        <td colspan="5" style="text-align:center;">No employees found</td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Controls -->
  <div *ngIf="showPagination()" style="margin-top:10px; text-align:center;">
    
    <!-- Previous Page -->
    <button type="button" (click)="prevPage()" [disabled]="currentPage === 1">Prev</button>

    <!-- Page Numbers -->
<button type="button"
        *ngFor="let page of pages"
        (click)="goToPage(page)"
        [class.active]="currentPage === page">
  {{ page }}
</button>

    <!-- Next Page -->
    <button type="button" (click)="nextPage()" [disabled]="currentPage === totalPages()">Next</button>
  </div>
</div>

<!-- Optional CSS for active page highlight -->
<style>
  .pagination button.active {
    font-weight: bold;
    background-color: #007bff;
    color: white;
  }

  
</style>
